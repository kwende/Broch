[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "broch"
version = "0.1.0"
description = "Open-data chronology and spatial diffusion research for Scottish brochs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "geopandas>=1.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "pyogrio>=0.10",
  "pydantic>=2.9",
  "shapely>=2.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/broch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
